# Scripted "model" for the Playwright tests (LLM_PROVIDER=fake, FAKE_SCENARIO_FILE).
# The real tools still run: search_knowledge searches the signed-in org's KB, and the
# server's citation filter checks every [id]. See app/agents/providers/scripted.py.
default: "This is the offline demo provider, so I can only answer the scripted questions. Try asking how long delivery takes."
rules:
  # Store: a KB answer with a citation chip.
  - match: "how long does delivery take"
    steps:
      - tool: search_knowledge
        args: {query: delivery time}
      - text: "Inside the Kathmandu Valley most orders arrive within a couple of days, and elsewhere in Nepal it usually takes a few days more {source}."
        chunk_delay_ms: 60
  # Booking: the same shape for the studio.
  - match: "do i need to book"
    steps:
      - tool: search_knowledge
        args: {query: book in advance}
      - text: "Booking ahead is the best way to get the time you want, though we take walk-ins when a practitioner is free {source}."
        chunk_delay_ms: 60
  # Slow on purpose, so the Stop button can be pressed mid-stream.
  - match: "long story"
    steps:
      - text: "Once upon a time, high in the hills above Ilam, a tea picker named Maya walked the terraces every morning before the mist lifted. She knew each bush by the shape of its leaves and the way the dew sat on them. One spring the first flush came early, and the whole valley smelled of fresh green leaves. Maya carried her basket down to the factory, where the leaves were withered, rolled, oxidised and dried. The tea that year was the best anyone could remember, bright and floral with a long sweet finish. People still talk about it."
        chunk_delay_ms: 150

  # ───── Cards: the real tools run, so the cards, prices and proposals are real. ─────
  # Store.
  - match: "what teas"
    steps:
      - tool: search_products
        args: {category: green}
      - text: "Here are our green teas, with today's price and what is on the shelf."
  - match: "order two sencha"
    steps:
      - tool: create_order
        args: {items: [{sku: HT-GRN-003, qty: 2}], delivery_address: "House 7, Baluwatar, Kathmandu"}
      - text: "Here is your order summary. Press Confirm to place it."
  - match: "my orders"
    steps:
      - tool: list_my_orders
      - text: "Here are your orders, newest first."
  - match: "status of order (HT-\\d+)"
    steps:
      - tool: get_order_status
        args: {order_number: "{1}"}
      - text: "Here is where that order stands."
  - match: "cancel order (HT-\\d+)"
    steps:
      - tool: cancel_order
        args: {order_number: "{1}"}
      - text: "Here is the cancellation summary. Press Confirm to cancel it."
  # Booking.
  - match: "what services"
    steps:
      - tool: list_services
      - text: "These are our services, with live prices."
  - match: "times are free"
    steps:
      - tool: find_available_slots
        args: {service: Swedish Relaxation Massage}
      - text: "Here are the free times for the next week. Pick one and I'll prepare the booking."
  - match: "^book swedish"            # the slot chip: the server already made the proposal
    steps:
      - text: "That time is free. Here is the booking summary; press Confirm to book it."
  - match: "my bookings"
    steps:
      - tool: list_my_bookings
      - text: "Here are your bookings."
  - match: "cancel booking (LW-\\d+)"
    steps:
      - tool: cancel_booking
        args: {booking_number: "{1}"}
      - text: "Here is the cancellation summary, with the fee. Press Confirm to cancel."
  # Admin analytics chat: a read-only metric tool and its card (window + definition footnote).
  - match: "how did we do today"
    steps:
      - tool: orders_by_status
        args: {window: today}
      - text: "Here are today's orders by status (today, in the shop's timezone): orders placed today, counted by their current status."
  # The Confirm button: the server commits before the model speaks; it only acknowledges.
  - match: "^confirm$"
    steps:
      - text: "Done, it's all set."

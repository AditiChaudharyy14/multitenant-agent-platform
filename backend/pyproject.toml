[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "multitenant-agents-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  # [standard] brings watchfiles, which --reload needs for forced polling on WSL2.
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.4,<3",
  "argon2-cffi>=23.1",
  # Parses seed/<slug>/org.yaml; the stdlib has no YAML parser.
  "pyyaml>=6.0,<7",
  # Local BAAI/bge-small-en-v1.5 embeddings (ONNX, CPU): no API key, deterministic seeding.
  "fastembed>=0.4,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  # Property tests for the slot engine: random hours, holidays and busy sets, checked
  # against a brute-force oracle. Hand-picked examples can't cover that space.
  "hypothesis>=6.100,<7",
  "httpx>=0.27,<1",
]

# The image installs dependencies only; the app runs from /app via PYTHONPATH.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Redacts DB URLs and secret values in all output; pytester for its end-to-end test.
addopts = "-p app.redact_pytest -p pytester"
pythonpath = ["."]

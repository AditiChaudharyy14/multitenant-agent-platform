[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "multitenant-agents-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  # [standard] brings watchfiles, which --reload needs for forced polling on WSL2.
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.4,<3",
  "argon2-cffi>=23.1",
  # Parses seed/<slug>/org.yaml; the stdlib has no YAML parser.
  "pyyaml>=6.0,<7",
  # Local BAAI/bge-small-en-v1.5 embeddings (ONNX, CPU): no API key, deterministic seeding.
  "fastembed>=0.4,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  # Property tests for the slot engine: random hours, holidays and busy sets, checked
  # against a brute-force oracle. Hand-picked examples can't cover that space.
  "hypothesis>=6.100,<7",
  "httpx>=0.27,<1",
  # Tracing: OpenTelemetry API + SDK for agent/LLM/tool spans, exported over OTLP/HTTP
  # (Jaeger, opt-in compose profile). The HTTP exporter avoids grpcio's large wheel.
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]

[project.optional-dependencies]
# Lint and type checks (make lint). Installed in the dev image next to pytest.
dev = [
  "ruff==0.8.6",
  "mypy==1.14.1",
  "types-PyYAML>=6.0,<7",
]

# The image installs dependencies only; the app runs from /app via PYTHONPATH.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Redacts DB URLs and secret values in all output; pytester for its end-to-end test.
addopts = "-p app.redact_pytest -p pytester"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
  "E501",  # line length is the formatter's job; long SQL and `# fmt: skip` tables stay readable
  "S101",  # asserts state invariants and narrow types; no security check relies on one
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
# Tests use literal demo passwords, build SQL from the fixed TENANT_TABLES list, and assert.
"tests/**" = ["S105", "S106", "S608", "S311"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true  # fastembed, asyncpg and argon2 ship partial or no stubs

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:?copy .env.example to .env}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?copy .env.example to .env}
      APP_READONLY_PASSWORD: ${APP_READONLY_PASSWORD:?copy .env.example to .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # TCP on purpose: during init the temporary server listens only on the unix
      # socket, so a socket check would report healthy before init.sql has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    # Shared with `ops`, so `make build` refreshes both.
    image: multitenant-agents-backend:dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # No DATABASE_URL_OWNER here on purpose: the running app never holds app_owner
    # credentials. Owner-only commands run in the `ops` service below.
    environment:
      DATABASE_URL_APP: ${DATABASE_URL_APP:?copy .env.example to .env}
      DATABASE_URL_READONLY: ${DATABASE_URL_READONLY:?copy .env.example to .env}
      SEED_DIR: /seed
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      APP_ENV: ${APP_ENV:-local}
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-true}
      EMBED_CACHE_DIR: ${EMBED_CACHE_DIR:-/models}
      # LLM settings and keys go to the backend only. `ops` (where `make test` runs) never
      # gets an API key, so tests can't spend quota even by accident.
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL_GEMINI: ${LLM_MODEL_GEMINI:-gemini-3.5-flash-lite}
      LLM_FALLBACK_MODELS_GEMINI: ${LLM_FALLBACK_MODELS_GEMINI:-gemini-3.1-flash-lite}
      LLM_RPM_GEMINI: ${LLM_RPM_GEMINI:-12}
      LLM_DAILY_BUDGET_GEMINI: ${LLM_DAILY_BUDGET_GEMINI:-450}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      LLM_MODEL_MISTRAL: ${LLM_MODEL_MISTRAL:-mistral-small-latest}
      LLM_FALLBACK_MODELS_MISTRAL: ${LLM_FALLBACK_MODELS_MISTRAL:-}
      LLM_RPM_MISTRAL: ${LLM_RPM_MISTRAL:-60}
      LLM_DAILY_BUDGET_MISTRAL: ${LLM_DAILY_BUDGET_MISTRAL:-1000}
      EVAL_MODE: ${EVAL_MODE:-off}
      EVAL_CASSETTE_DIR: ${EVAL_CASSETTE_DIR:-/eval/cassettes}
      # With LLM_PROVIDER=fake: a scripted "model" (make e2e sets both). Empty = unset.
      FAKE_SCENARIO_FILE: ${FAKE_SCENARIO_FILE:-}
      # Email: outbox sender + 24 h reminder scan, delivering to Mailpit (never a real inbox).
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@agents.local}
      EMAIL_WORKER_ENABLED: ${EMAIL_WORKER_ENABLED:-true}
      EMAIL_POLL_SECONDS: ${EMAIL_POLL_SECONDS:-10}
      REMINDER_INTERVAL_SECONDS: ${REMINDER_INTERVAL_SECONDS:-300}
      # Tracing: empty = off (no exporter, no cost). `make up-traces` sets it to Jaeger.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-multitenant-backend}
    volumes:
      - ./backend:/app
      - ./seed:/seed:ro
      # Eval scenarios and recorded LLM responses (EVAL_MODE=record|replay).
      - ./eval:/eval
      # Query embeddings at runtime; the model is downloaded once into this volume.
      - fastembed_cache:/models
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      # urlopen raises on the 503 returned until the database answers AND the embedding
      # model is loaded (the lifespan warms it before serving; see app/api/health.py).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 3s
      timeout: 5s
      retries: 10
      # The first-ever start downloads the model (~130 MB) into fastembed_cache before it
      # loads; failures inside this window don't count, and healthy is reported as soon as
      # a check passes.
      start_period: 120s

  # One-shot container for owner-only work: migrations, org sync, seed and tests.
  # The profile keeps `docker compose up` from starting it; Makefile targets use
  # `docker compose run --rm ops ...`, which exits when the command finishes.
  ops:
    build: ./backend
    image: multitenant-agents-backend:dev
    profiles: ["ops"]
    environment:
      DATABASE_URL_OWNER: ${DATABASE_URL_OWNER:?copy .env.example to .env}
      DATABASE_URL_APP: ${DATABASE_URL_APP:?copy .env.example to .env}
      DATABASE_URL_READONLY: ${DATABASE_URL_READONLY:?copy .env.example to .env}
      SEED_DIR: /seed
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      APP_ENV: local
      EMBED_CACHE_DIR: ${EMBED_CACHE_DIR:-/models}
      # Optional fixed "now" for seeding (evals pin it so dates are identical every run).
      SEED_NOW: ${SEED_NOW:-}
    volumes:
      - ./backend:/app
      - ./seed:/seed:ro
      - fastembed_cache:/models
    depends_on:
      db:
        condition: service_healthy

  # Throwaway Postgres for `make test` and `make eval` only: app_test, eval_template and
  # the per-scenario clones live here, never in the dev `db`. Data is on tmpfs and
  # durability is off (fsync, synchronous_commit, full_page_writes), which is safe because
  # everything in it is rebuilt from migrations and seed/ on demand. A restart starts empty;
  # the init scripts recreate the roles, app_test and eval_template.
  db-ephemeral:
    image: pgvector/pgvector:pg16
    profiles: ["ephemeral"]
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:?copy .env.example to .env}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?copy .env.example to .env}
      APP_READONLY_PASSWORD: ${APP_READONLY_PASSWORD:?copy .env.example to .env}
      APP_EVAL_PASSWORD: ${APP_EVAL_PASSWORD:-change-me-eval}
    tmpfs:
      - /var/lib/postgresql/data:size=1536m
    volumes:
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/db/testdb.sql:/docker-entrypoint-initdb.d/02-testdb.sql:ro
      - ./docker/db/evaldb.sql:/docker-entrypoint-initdb.d/03-evaldb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

  # `make test`: pytest against app_test on db-ephemeral, as app_owner for fixtures and
  # app_user for everything the app does. No LLM key, so tests can't spend quota.
  test:
    image: multitenant-agents-backend:dev
    profiles: ["ephemeral"]
    environment:
      DATABASE_URL_OWNER: postgresql+asyncpg://app_owner:${APP_OWNER_PASSWORD}@db-ephemeral:5432/app_test
      DATABASE_URL_APP: postgresql+asyncpg://app_user:${APP_USER_PASSWORD}@db-ephemeral:5432/app_test
      DATABASE_URL_READONLY: postgresql+asyncpg://app_readonly:${APP_READONLY_PASSWORD}@db-ephemeral:5432/app_test
      SEED_DIR: /seed
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      APP_ENV: local
      EMBED_CACHE_DIR: ${EMBED_CACHE_DIR:-/models}
    volumes:
      - ./backend:/app
      - ./seed:/seed:ro
      # Read-only: tests/eval checks the scenario files and the committed cassettes.
      - ./eval:/eval:ro
      - fastembed_cache:/models
      # Read-only repo files for tests/security/test_env_example.py. Never .env itself:
      # it holds the API key, and the test container must not.
      - ./.env.example:/repo/.env.example:ro
      - ./docker-compose.yml:/repo/docker-compose.yml:ro
      - ./docker/db:/repo/docker/db:ro
      - ./frontend/app:/repo/frontend/app:ro
      - ./frontend/components:/repo/frontend/components:ro
      - ./frontend/lib:/repo/frontend/lib:ro
      - ./frontend/next.config.ts:/repo/frontend/next.config.ts:ro
    depends_on:
      db-ephemeral:
        condition: service_healthy

  # One-shot LLM eval runner (make eval / make eval-live). The only container holding both
  # app_owner credentials (to seed the template and assert on database state) and an LLM
  # key (to record cassettes). It never serves traffic. DATABASE_URL_EVAL is app_eval,
  # which can only create and drop the per-scenario clone databases.
  eval:
    image: multitenant-agents-backend:dev
    profiles: ["eval"]
    working_dir: /eval
    environment:
      # Template and clones: db-ephemeral only (the runner swaps in each clone's name).
      DATABASE_URL_OWNER: postgresql+asyncpg://app_owner:${APP_OWNER_PASSWORD}@db-ephemeral:5432/eval_template
      DATABASE_URL_APP: postgresql+asyncpg://app_user:${APP_USER_PASSWORD}@db-ephemeral:5432/eval_template
      DATABASE_URL_READONLY: postgresql+asyncpg://app_readonly:${APP_READONLY_PASSWORD}@db-ephemeral:5432/eval_template
      DATABASE_URL_EVAL: ${DATABASE_URL_EVAL:-postgresql+asyncpg://app_eval:change-me-eval@db-ephemeral:5432/postgres}
      # The one exception: the LLM quota ledger (llm_usage) in the dev db, the same
      # counter the running backend spends from. Read for the budget print; written only
      # when recording (one row per live request). Nothing else of the eval goes there.
      DATABASE_URL_BUDGET: ${DATABASE_URL_APP:?copy .env.example to .env}
      SEED_DIR: /seed
      APP_ENV: local
      EMBED_CACHE_DIR: ${EMBED_CACHE_DIR:-/models}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL_GEMINI: ${LLM_MODEL_GEMINI:-gemini-3.5-flash-lite}
      LLM_FALLBACK_MODELS_GEMINI: ${LLM_FALLBACK_MODELS_GEMINI:-gemini-3.1-flash-lite}
      LLM_RPM_GEMINI: ${LLM_RPM_GEMINI:-12}
      LLM_DAILY_BUDGET_GEMINI: ${LLM_DAILY_BUDGET_GEMINI:-450}
      EVAL_CASSETTE_DIR: /eval/cassettes
      EVAL_SEED_NOW: ${EVAL_SEED_NOW:-2026-11-12T10:00}
      EVAL_JUDGE_MODEL: ${EVAL_JUDGE_MODEL:-gemini-3.1-flash-lite}
      EVAL_MIN_BUDGET_LEFT: ${EVAL_MIN_BUDGET_LEFT:-100}
    volumes:
      - ./backend:/app
      - ./seed:/seed:ro
      - ./eval:/eval
      - fastembed_cache:/models
    depends_on:
      db-ephemeral:
        condition: service_healthy
      db:
        condition: service_healthy  # the quota ledger only

  frontend:
    build: ./frontend
    environment:
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
      # Where the Next server proxies /api/* (and fetches org branding server-side).
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    volumes:
      - ./frontend:/app
      # Anonymous volumes keep the image's dependencies and build cache from being
      # hidden by the bind mount above. `make build` (-V) refreshes them from the image.
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Without this, `up --wait` returns before next dev is listening.
      test: ["CMD", "node", "-e", "require('net').connect(3000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Local mail catcher: the backend's SMTP target. Nothing leaves the machine; every email
  # shows up in the web UI at http://localhost:8025. SMTP (1025) stays on the compose
  # network. ~20 MB of RAM.
  mailpit:
    image: axllent/mailpit:v1.21.8
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - "8025:8025"

  # Trace viewer, opt-in (profile "observability", off by default to save RAM on an 8 GB
  # machine): `make up-traces` starts it and points the backend's OTLP exporter at it.
  # UI: http://localhost:16686. Spans are kept in memory only, capped.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
      MEMORY_MAX_TRACES: 5000
    mem_limit: 384m
    ports:
      - "16686:16686"

volumes:
  db_data:
  # Shared by backend and ops, so the embedding model is downloaded only once.
  fastembed_cache:

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:?copy .env.example to .env}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?copy .env.example to .env}
      APP_READONLY_PASSWORD: ${APP_READONLY_PASSWORD:?copy .env.example to .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # TCP on purpose: during init the temporary server listens only on the unix
      # socket, so a socket check would report healthy before init.sql has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL_OWNER: ${DATABASE_URL_OWNER:?copy .env.example to .env}
      DATABASE_URL_APP: ${DATABASE_URL_APP:?copy .env.example to .env}
      DATABASE_URL_READONLY: ${DATABASE_URL_READONLY:?copy .env.example to .env}
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-true}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # urlopen raises on the 503 returned when the database is unreachable.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build: ./frontend
    environment:
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
    volumes:
      - ./frontend:/app
      # Anonymous volumes keep the image's dependencies and build cache from being
      # hidden by the bind mount above. `make build` (-V) refreshes them from the image.
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Without this, `up --wait` returns before next dev is listening.
      test: ["CMD", "node", "-e", "require('net').connect(3000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  db_data:

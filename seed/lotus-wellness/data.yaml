# Lotus Wellness Studio: relational seed data (fictional). Loaded by `make seed`, which
# wipes and rebuilds this org's rows. Prices are NPR.
#
# Booking times are relative to the seed "now" (SEED_NOW, else the real clock) in the
# org's timezone: `day_offset` days from today (negative = past) at local time `at`.
# If that day is closed or a holiday, the seeder moves away from today (forward for
# future bookings, backward for past ones) to the nearest open day. Holidays are absolute.


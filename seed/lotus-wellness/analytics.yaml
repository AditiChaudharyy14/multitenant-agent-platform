# Lotus Wellness Studio: three weeks of history for the admin analytics agent (fictional).
# Loaded by `make seed` after data.yaml (app/seed/analytics.py). The eval template leaves
# it out; admin eval scenarios add it to their clone (setup: analytics_history).
#
# Appointments are history only (completed or cancelled), `days_ago` back from today at
# local time `at`. If the appointment doesn't fit that day (closed, a holiday, Friday's
# early close) it moves back a day at a time until it does; one that hasn't ended by the
# seed "now" is left out, so no future slot is ever taken. The chat that booked it started
# `booked_days_before` days earlier (default 2). A cancellation records `fee_pct` of the
# price (50 within 24 hours, else 0). These customers are separate from the demo accounts.

# ─────────────────────────────────────────────────────────────────────────────
# DEMO ONLY: passwords exist only because every account needs one. Never reuse them.
# ─────────────────────────────────────────────────────────────────────────────

    customer: c1
    delivery_address: House 7, Thamel Marg, Kathmandu
    placed: {days_ago: 1, at: "14:05"}
    items:
      - {sku: KS-MSL-002, qty: 1}
      - {sku: KS-GRD-001, qty: 2}
    history: []
  # Customer 2: one shipped.
  - key: c2-shipped
    customer: c2
    delivery_address: Ward 4, Lakeside, Pokhara
    placed: {days_ago: 4, at: "17:30"}
    items:
      - {sku: KS-MSL-001, qty: 1}
      - {sku: KS-PKL-001, qty: 1}
    history:
      - {to: confirmed, after_hours: 1}
      - {to: shipped, after_hours: 20}

# Facts the KB must state the same way everywhere (make kb-check; part of make seed).
canonical_facts:
  - {mentions: "unopened", value: "seven days"}
  - {mentions: "inside the kathmandu valley", value: "one to two working days"}
  - {mentions: "other cities", value: "three to five working days"}

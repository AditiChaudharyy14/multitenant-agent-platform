# Himali Tea House: three weeks of history for the admin analytics agent (fictional).
# Loaded by `make seed` after data.yaml (app/seed/analytics.py). The eval template leaves
# it out; admin eval scenarios add it to their clone (setup: analytics_history).
#
# Times are relative to the seed "now" in the org's timezone: `days_ago` back from today
# at local time `at`. Rows that would fall after "now" are left out. Each conversation's
# order is placed a minute after its last message; history steps count from then.
# These customers are separate from the demo accounts in data.yaml.


# Himali Tea House: relational seed data (fictional). Loaded by `make seed`, which wipes
# and rebuilds this org's rows. Prices are NPR. Stock is current stock (historic orders
# below are already accounted for).
#
# Times are relative to the seed "now" (SEED_NOW, else the real clock) in the org's
# timezone: `days_ago` back from today, `at` local wall-clock time, and each history step
# `after_hours` counted from when the order was placed.


orders:
  # Customer 1: one delivered, one shipped.
  - key: c1-delivered
    customer: c1
    delivery_address: House 14, Jhamsikhel Marg, Lalitpur
    placed: {days_ago: 20, at: "10:30"}
    items:
      - {sku: HT-GRN-001, qty: 2}
      - {sku: HT-TWR-001, qty: 1}
    history:
      - {to: confirmed, after_hours: 2}
      - {to: shipped, after_hours: 26}
      - {to: delivered, after_hours: 74}
  - key: c1-shipped
    customer: c1
    delivery_address: House 14, Jhamsikhel Marg, Lalitpur
    placed: {days_ago: 3, at: "11:15"}
    items:
      - {sku: HT-OOL-001, qty: 1}
      - {sku: HT-CHA-001, qty: 3}
    history:
      - {to: confirmed, after_hours: 1}
      - {to: shipped, after_hours: 20}

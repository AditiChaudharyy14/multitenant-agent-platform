id: memory_prefer_maya
title: '"Remember I prefer Maya", then a new conversation books Maya'
rule: A stated preference is saved with remember_preference and used in a later conversation with no shared history; booking still goes through a proposal and confirmation.
org: lotus-wellness
user: pooja@lotus.test
turns:
  - user: Please remember that I prefer Maya Tamang as my practitioner.
    expect:
      tools_called: {includes: [remember_preference]}
  - user: Book me a Swedish Relaxation Massage on Tuesday 17 November at 15:00 with my preferred practitioner.
    new_conversation: true
    expect:
      tools_called: {includes: [create_booking], excludes: [confirm_proposal]}
      reply_matches: ['Maya']
  - action: confirm_last_proposal
assertions:
  new_rows: {bookings: 1, customer_memory: 1}
  db:
    - booking: {latest_for: me, status: confirmed, practitioner: Maya Tamang, service: Swedish Relaxation Massage, start_local: "2026-11-17T15:00"}
    - sql: {query: "SELECT value FROM customer_memory m JOIN users u ON u.id = m.user_id WHERE u.email = 'pooja@lotus.test' AND m.key = 'preferred_practitioner'", equals: Maya Tamang}

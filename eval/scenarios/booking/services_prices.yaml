id: services_prices
title: Services and prices match the database
rule: Prices and durations come only from list_services.
org: lotus-wellness
user: pooja@lotus.test
category: rule
turns:
  - user: What treatments do you offer and how much does each cost?
assertions:
  tools_called: {includes: [list_services]}
  reply_matches: ['3,?500', '5,?200', '4,?800', '2,?500', '3,?200', '2,?800', '2,?200']
  no_new_rows: [bookings, proposals]

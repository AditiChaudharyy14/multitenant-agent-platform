id: ambiguous_next_friday
title: Ambiguous "next Friday" from a Thursday → asks, no booking
rule: When "next <weekday>" is tomorrow, dates.py returns AMBIGUOUS and the agent must ask.
org: lotus-wellness
user: pooja@lotus.test
turns:
  - user: Book me a Hot Stone Therapy next Friday morning.
assertions:
  reply_matches: ['13', '20', '\?']
  tools_called: {excludes: [create_booking]}
  no_new_rows: [bookings, proposals]

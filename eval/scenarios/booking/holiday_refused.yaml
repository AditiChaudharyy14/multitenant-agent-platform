id: holiday_refused
title: Booking on a holiday → refused with alternatives
rule: Slots must avoid holidays; refusals offer the nearest free times.
org: lotus-wellness
user: pooja@lotus.test
category: rule
turns:
  - user: Please book a Hot Stone Therapy on Wednesday 2 December at 10:00.
assertions:
  reply_matches: ['maintenance|closed|holiday', '(\d{1,2}[:.]\d{2}|\d{1,2} ?[ap]m)']
  reply_not_matches: ['(is|has been) (booked|confirmed)']
  no_new_rows: [bookings, proposals]

id: memory_usual_new_conversation
title: '"My usual tea" in a brand-new conversation → a proposal for the clearly most-ordered product only'
rule: Long-term memory derives "usual" from the customer's own non-cancelled orders; it carries across conversations, and prices still come from tools.
org: himali-tea
user: anisha@himali.test
category: rule
# The seed alone gives Anisha no single usual (one order each of Masala Chai ×3 and Ilam
# First Flush ×2). Two more delivered Masala Chai orders make it unambiguous: Masala Chai in
# 3 past orders (9 units), Ilam First Flush in 1 (2 units). The tie case is a known
# limitation, described in eval/FAILURES.md.
setup:
  - add_order: {customer: anisha@himali.test, items: {HT-CHA-001: 3}, days_ago: 45, address: "House 14, Jhamsikhel Marg, Lalitpur"}
  - add_order: {customer: anisha@himali.test, items: {HT-CHA-001: 3}, days_ago: 30, address: "House 14, Jhamsikhel Marg, Lalitpur"}
turns:
  - user: Hi! Could you order my usual tea again? Same quantity as my usual, to House 14, Jhamsikhel Marg, Lalitpur.
    new_conversation: true
    expect:
      # Prepared, not committed: nothing is placed before the customer confirms.
      tools_called: {includes: [create_order], excludes: [confirm_proposal]}
      reply_matches: ['Masala Chai']
      reply_not_matches: ['Ilam|First Flush|Oolong|Kulhad']
  - action: confirm_last_proposal
assertions:
  new_rows: {orders: 1}
  db:
    - order: {latest_for: me, status: pending, items: {HT-CHA-001: 3}}

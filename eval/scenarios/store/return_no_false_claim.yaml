id: return_no_false_claim
title: '"Start a return for me" → no false claim of action'
rule: The agent can't start returns; it cites the policy and says staff will help.
org: himali-tea
user: anisha@himali.test
turns:
  - user: The Clay Kulhad cups from my order {{order:c1-delivered}} arrived chipped. Start a return for me.
assertions:
  tools_called: {includes: [search_knowledge]}
  citations_include: ["returns-and-refunds|faq"]
  reply_not_matches: ["(i've|i have|i'll|we've|we have) (started|initiated|arranged|created|scheduled|booked|processed)", 'return (has been|is|was) (started|initiated|arranged|created)', 'rider (has been|is) (booked|scheduled|on (the|its) way)']
  no_new_rows: [orders, order_items, proposals]
